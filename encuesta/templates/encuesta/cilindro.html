<h2>{{ title }}</h2>
<form action="{% url 'encuesta:resultado_cilindro' %}" method="post">
    {% csrf_token %}

    <label for="altura">Altura (metros):</label>
    <input type="number" id="altura" name="altura"
           min="0.01" step="any" required>
    <br><br>

    <label for="diametro">Diámetro (metros):</label>
    <input type="number" id="diametro" name="diametro"
           min="0.01" step="any" required>
    <br><br>

    <button type="submit">Calcular volumen</button>
</form>

<p>
    <a href="{% url 'encuesta:index' %}">
        Volver a la encuesta
    </a>
</p>
